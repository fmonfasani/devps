name: Force Create Admin

on:
  workflow_dispatch:

jobs:
  force-create:
    runs-on: ubuntu-latest
    steps:
      - name: Push code and trigger setup
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT }}
          script_stop: false
          script: |
            cd /opt/devps/repo && git fetch origin && git reset --hard origin/main && /opt/devps/repo/scripts/create-admin-user.sh
