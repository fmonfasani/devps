name: Create Admin User

on:
  workflow_dispatch:

jobs:
  create-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Create admin user on VPS
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/devps/repo
            git fetch origin main
            git reset --hard origin/main
            python3 << 'PYTHON_EOF'
            import sqlite3
            import sys
            sys.path.insert(0, '/opt/devps/repo/agent')

            from devps_agent import auth

            username = "fmonfasani@gmail.com"
            password = "Kara3010"
            db_path = "/opt/devps/data/registry.db"

            hash_hex, salt_hex = auth.hash_password(password)

            conn = sqlite3.connect(db_path)
            try:
                conn.execute("""
                    INSERT INTO users (username, password_hash, password_salt, role, created_at, created_by)
                    VALUES (?, ?, ?, 'admin', datetime('now'), NULL)
                """, (username, hash_hex, salt_hex))
                conn.commit()
                print(f"✓ Admin user '{username}' created successfully")
            except sqlite3.IntegrityError:
                print(f"! User '{username}' already exists (updating password)")
                conn.execute("""
                    UPDATE users SET password_hash = ?, password_salt = ?
                    WHERE username = ?
                """, (hash_hex, salt_hex, username))
                conn.commit()
                print(f"✓ Password updated for '{username}'")
            finally:
                conn.close()
            PYTHON_EOF
