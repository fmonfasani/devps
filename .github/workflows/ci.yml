name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent:
    name: Agent · Lint · Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: |
          ruff check --output-format=github .
          ruff format --check .
      - name: pytest
        run: pytest -q

  cli-syntax:
    name: CLI · Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile cli/hzploy
