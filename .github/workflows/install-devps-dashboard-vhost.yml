name: Install devps.webshooks.com vhost + certificate

# One-off. Gives the devps dashboard/API a real public HTTPS domain instead
# of SSH-tunnel-only access. Mirrors exactly what nginx.py's install_vhost()
# does for any other devps-managed project — bootstrap HTTP vhost for the
# ACME challenge, mint the cert, then the full HTTPS vhost proxying to the
# agent's own port (127.0.0.1:9400). Safe to re-run — idempotent.
#
# Vhost content is base64-encoded and written with a single `echo | base64
# -d > file` line rather than a `cat <<EOF` heredoc — a heredoc here
# previously got corrupted by appleboy/ssh-action's drone-ssh backend,
# which injects an exit-code tracking line (DRONE_SSH_PREV_COMMAND_EXIT_CODE=0)
# between script lines; that line landed inside the heredoc's stdin and
# broke the resulting nginx config. A single-line write has no multi-line
# boundary for that injection to land inside.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-dns:
    name: Confirm DNS has propagated (no SSH)
    runs-on: ubuntu-latest
    outputs:
      resolved: ${{ steps.check.outputs.resolved }}
    steps:
      - name: dig devps.webshooks.com
        id: check
        run: |
          ip=$(dig +short devps.webshooks.com A | tail -1)
          echo "resolved to: ${ip:-<nothing>}"
          if [ "$ip" = "89.167.96.239" ]; then
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          else
            echo "resolved=false" >> "$GITHUB_OUTPUT"
            echo "::warning::devps.webshooks.com does not resolve to 89.167.96.239 yet (got: ${ip:-nothing}) — DNS may still be propagating"
          fi

  install-vhost:
    name: Write vhost + mint certificate
    needs: check-dns
    if: needs.check-dns.outputs.resolved == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: SSH install
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          BOOTSTRAP_B64: c2VydmVyIHsKICAgIGxpc3RlbiA4MDsKICAgIGxpc3RlbiBbOjpdOjgwOwogICAgc2VydmVyX25hbWUgZGV2cHMud2Vic2hvb2tzLmNvbTsKICAgIGxvY2F0aW9uIC8ud2VsbC1rbm93bi9hY21lLWNoYWxsZW5nZS8gewogICAgICAgIHJvb3QgL3Zhci93d3cvY2VydGJvdDsKICAgIH0KICAgIGxvY2F0aW9uIC8gewogICAgICAgIHJldHVybiA0MDQ7CiAgICB9Cn0K
          FULL_B64: 
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT || 22 }}
          script_stop: true
          envs: BOOTSTRAP_B64,FULL_B64
          script: |
            set -euo pipefail
            DOMAIN=devps.webshooks.com
            WEBROOT=/var/www/certbot
            AVAILABLE=/etc/nginx/sites-available/$DOMAIN
            ENABLED=/etc/nginx/sites-enabled/$DOMAIN

            mkdir -p "$WEBROOT"

            if [ ! -d "/etc/letsencrypt/live/$DOMAIN" ]; then
              echo "===== writing bootstrap (ACME-only) vhost ====="
              echo "$BOOTSTRAP_B64" | base64 -d > "$AVAILABLE"
              ln -sf "$AVAILABLE" "$ENABLED"
              nginx -t
              systemctl reload nginx

              echo "===== requesting certificate ====="
              certbot certonly --webroot -w "$WEBROOT" -d "$DOMAIN" --non-interactive --agree-tos --email admin@webshooks.com
            else
              echo "certificate already exists for $DOMAIN, skipping certbot"
            fi

            echo "===== writing full HTTPS vhost ====="
            echo "$FULL_B64" | base64 -d > "$AVAILABLE"
            ln -sf "$AVAILABLE" "$ENABLED"
            nginx -t
            systemctl reload nginx

            echo "===== smoke test ====="
            curl -s -o /dev/null -w 'https://%{url_effective} -> %{http_code}\n' "https://$DOMAIN/health"
