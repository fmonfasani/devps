name: Setup dashboard credentials

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Dashboard username"
        required: true
      password:
        description: "Dashboard password"
        required: true

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Calculate password hash
        env:
          PASSWORD: ${{ inputs.password }}
        run: |
          python3 << 'SETUP_EOF'
          import hashlib
          import os
          import sys

          password = os.environ.get("PASSWORD", "").encode()
          if not password:
              sys.exit("PASSWORD env var not set")

          salt = os.urandom(16)
          hash_bytes = hashlib.pbkdf2_hmac("sha256", password, salt, 100_000)

          print(f"HASH={hash_bytes.hex()}")
          print(f"SALT={salt.hex()}")
          SETUP_EOF
        id: hash

      - name: Update credentials on VPS
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        env:
          DASH_USER: ${{ inputs.username }}
          DASH_HASH: ${{ steps.hash.outputs.HASH }}
          DASH_SALT: ${{ steps.hash.outputs.SALT }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT }}
          script: |
            echo "$DASH_USER|$DASH_HASH|$DASH_SALT" | base64 -w0 > /tmp/creds.b64
            cat /tmp/creds.b64 | base64 -d | awk -F'|' '{print "DEVPS_DASHBOARD_USERNAME="$1"\nDEVPS_DASHBOARD_PASSWORD_HASH="$2"\nDEVPS_DASHBOARD_PASSWORD_SALT="$3}' >> /opt/devps/agent.env
            rm /tmp/creds.b64
            sudo systemctl restart devps-agent
            sleep 2
            sudo systemctl status devps-agent
