{% extends "base.html" %}
{% block title %}devps — initial setup{% endblock %}
{% block content %}
<form class="login" method="post" action="/dashboard/setup">
  <h2>devps — Setup</h2>
  <p class="muted">Configure your dashboard credentials</p>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  {% if success %}<div style="color: #6fd48a; margin-bottom: 1rem;">{{ success }}</div>{% endif %}

  <label for="username">Username</label>
  <input type="text" id="username" name="username" autofocus required>

  <label for="password">Password</label>
  <input type="password" id="password" name="password" required>

  <button type="submit">Create Credentials</button>
</form>
{% endblock %}
